    <!-- Audio Synthesizer & Game Logic Script -->
    <script>
        // --- Web Audio API Synthesizer ---
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playClack() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playCapture() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            },
            playCheck() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.setValueAtTime(900, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        // --- Constants & Variables ---
        const BOARD_SIZE = 8;
        const SQUARE_SIZE = 2;
        const OFFSET = (BOARD_SIZE * SQUARE_SIZE) / 2 - SQUARE_SIZE / 2;

        let scene, camera, renderer, controls;
        let raycaster, mouse;

        let chess = new Chess(); // Engine logic
        let pieceMeshes = {};    // Mapping piece ID -> 3D Mesh
        let highlightRings = [];

        // Modes & Config
        let gameMode = 'ai'; // 'ai' or 'p2p'
        let botLevel = 1;
        let playerColor = 'w'; // 'w' or 'b'
        let peer = null, conn = null;
        let myRoomCode = '';

        // Selected Piece & Highlighting
        let selectedSquare = null;

        // Materials
        let matWhite, matBlack, matTileLight, matTileDark;

        // --- Window Initialization ---
        window.onload = function() {
            initThree();
            initMaterials();
            initBoardGraphics();
            syncBoardFromEngine();
            initPeerJS();
            setupUIEventListeners();
            animate();
        };

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030712);
            scene.fog = new THREE.FogExp2(0x030712, 0.02);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 16);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 8;
            controls.maxDistance = 35;
            controls.target.set(0, 0, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x10b981, 1.0);
            dirLight.position.set(12, 22, 14);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 50;
            const d = 10;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x6366f1, 0.5);
            fillLight.position.set(-12, 12, -14);
            scene.add(fillLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);
        }

        function initMaterials() {
            // Emerald Malachite (White Pieces)
            matWhite = new THREE.MeshStandardMaterial({
                color: 0x10b981,
                roughness: 0.25,
                metalness: 0.15,
                emissive: 0x047857,
                emissiveIntensity: 0.15
            });

            // Dark Obsidian (Black Pieces)
            matBlack = new THREE.MeshStandardMaterial({
                color: 0x0f172a,
                roughness: 0.2,
                metalness: 0.6,
                emissive: 0x020617,
                emissiveIntensity: 0.1
            });

            // Board Tiles
            matTileLight = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            matTileDark = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.5 });
        }

        function initBoardGraphics() {
            // Frame
            const frameGeo = new THREE.BoxGeometry(BOARD_SIZE * SQUARE_SIZE + 1.2, 0.6, BOARD_SIZE * SQUARE_SIZE + 1.2);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.3, metalness: 0.5 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.y = -0.35;
            frame.receiveShadow = true;
            scene.add(frame);

            // 8x8 Tiles
            const tileGeo = new THREE.BoxGeometry(SQUARE_SIZE, 0.15, SQUARE_SIZE);
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const isLight = (r + c) % 2 === 0;
                    const tile = new THREE.Mesh(tileGeo, isLight ? matTileLight : matTileDark);
                    tile.position.set(c * SQUARE_SIZE - OFFSET, -0.075, r * SQUARE_SIZE - OFFSET);
                    tile.receiveShadow = true;
                    tile.userData = { row: r, col: c, square: coordsToSquare(r, c) };
                    scene.add(tile);
                }
            }
        }

        // --- Detailed Procedural 3D Piece Models ---
        function createSculptedPiece(type, color) {
            const group = new THREE.Group();
            const mat = color === 'w' ? matWhite : matBlack;

            // Base Pedestal
            const baseGeo = new THREE.CylinderGeometry(0.6, 0.68, 0.25, 16);
            const base = new THREE.Mesh(baseGeo, mat);
            base.position.y = 0.125;
            group.add(base);

            const pType = type.toLowerCase();

            if (pType === 'p') { // Pawn
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.45, 0.7, 16), mat);
                stem.position.y = 0.6;
                group.add(stem);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), mat);
                head.position.y = 1.05;
                group.add(head);
            } else if (pType === 'r') { // Rook (Castle)
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.9, 16), mat);
                body.position.y = 0.7;
                group.add(body);

                const top = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.45, 0.35, 16), mat);
                top.position.y = 1.25;
                group.add(top);
            } else if (pType === 'n') { // Knight (Detailed Warhorse Face)
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 0.6, 16), mat);
                body.position.y = 0.55;
                group.add(body);

                // Horse Neck & Snout
                const neck = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.6, 0.45), mat);
                neck.position.set(0, 0.95, -0.05);
                neck.rotation.x = -0.25;
                group.add(neck);

                const snout = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.35, 0.5), mat);
                snout.position.set(0, 1.15, 0.2);
                group.add(snout);

                const ear1 = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.2, 8), mat);
                ear1.position.set(-0.1, 1.4, -0.15);
                group.add(ear1);

                const ear2 = ear1.clone();
                ear2.position.x = 0.1;
                group.add(ear2);
            } else if (pType === 'b') { // Bishop (Mitre + Cross)
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 1.0, 16), mat);
                body.position.y = 0.75;
                group.add(body);

                const mitre = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), mat);
                mitre.scale.set(1, 1.35, 1);
                mitre.position.y = 1.4;
                group.add(mitre);

                const tip = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), mat);
                tip.position.y = 1.95;
                group.add(tip);
            } else if (pType === 'q') { // Queen (Coronet)
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, 1.3, 16), mat);
                body.position.y = 0.9;
                group.add(body);

                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.3, 0.4, 16), mat);
                crown.position.y = 1.65;
                group.add(crown);

                const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), mat);
                jewel.position.y = 1.95;
                group.add(jewel);
            } else if (pType === 'k') { // King (Imperial Cross)
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.58, 1.4, 16), mat);
                body.position.y = 0.95;
                group.add(body);

                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.38, 0.45, 16), mat);
                crown.position.y = 1.75;
                group.add(crown);

                const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.32, 0.08), mat);
                crossV.position.y = 2.1;
                const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.08, 0.08), mat);
                crossH.position.y = 2.1;
                group.add(crossV);
                group.add(crossH);
            }

            group.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            return group;
        }

        // --- Synchronize Engine State to 3D Scene ---
        function syncBoardFromEngine() {
            // Remove existing meshes
            Object.values(pieceMeshes).forEach(mesh => scene.remove(mesh));
            pieceMeshes = {};

            const board = chess.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const sq = coordsToSquare(r, c);
                        const mesh = createSculptedPiece(piece.type, piece.color);
                        
                        const pos = squareToVector(sq);
                        mesh.position.copy(pos);
                        mesh.userData = { square: sq, type: piece.type, color: piece.color };

                        scene.add(mesh);
                        pieceMeshes[sq] = mesh;
                    }
                }
            }

            updateUI();
        }

        // --- Interaction & Moves ---
        function onPointerDown(event) {
            // Ignore click if clicking UI overlays
            if (event.target.closest('.pointer-events-auto')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let clickedSquare = null;

                for (let hit of intersects) {
                    let obj = hit.object;
                    while (obj.parent && obj.parent !== scene && !obj.userData.square) {
                        obj = obj.parent;
                    }

                    if (obj.userData.square) {
                        clickedSquare = obj.userData.square;
                        break;
                    }
                }

                if (clickedSquare) {
                    handleSquareClick(clickedSquare);
                }
            }
        }

        function handleSquareClick(sq) {
            if (chess.game_over()) return;

            // Turn guard for P2P/AI
            if (gameMode === 'ai' && chess.turn() !== playerColor) return;
            if (gameMode === 'p2p' && chess.turn() !== playerColor) return;

            if (selectedSquare === sq) {
                deselectSquare();
                return;
            }

            // If a square is already selected, attempt move
            if (selectedSquare) {
                const moves = chess.moves({ square: selectedSquare, verbose: true });
                const validMove = moves.find(m => m.to === sq);

                if (validMove) {
                    makeMove(validMove);
                    deselectSquare();

                    // If playing online, transmit move via PeerJS
                    if (gameMode === 'p2p' && conn) {
                        conn.send({ type: 'MOVE', move: validMove });
                    }

                    // If playing AI, trigger Bot move delay
                    if (gameMode === 'ai' && !chess.game_over()) {
                        setTimeout(triggerBotMove, 400);
                    }
                    return;
                }
            }

            // Otherwise, select piece if it belongs to current player
            const piece = chess.get(sq);
            if (piece && piece.color === chess.turn()) {
                selectedSquare = sq;
                highlightValidMoves(sq);
            } else {
                deselectSquare();
            }
        }

        function makeMove(moveObj) {
            const move = chess.move(moveObj);
            if (!move) return;

            // Audio FX
            if (move.captured) {
                AudioFX.playCapture();
            } else {
                AudioFX.playClack();
            }

            if (chess.in_check()) {
                AudioFX.playCheck();
            }

            // GSAP Smooth Move Arc Animation
            const fromPos = squareToVector(move.from);
            const toPos = squareToVector(move.to);
            const mesh = pieceMeshes[move.from];

            if (mesh) {
                delete pieceMeshes[move.from];

                // If target piece captured, remove mesh
                if (pieceMeshes[move.to]) {
                    scene.remove(pieceMeshes[move.to]);
                    delete pieceMeshes[move.to];
                }

                pieceMeshes[move.to] = mesh;
                mesh.userData.square = move.to;

                gsap.to(mesh.position, {
                    x: toPos.x,
                    z: toPos.z,
                    duration: 0.3,
                    ease: "power2.out"
                });

                gsap.to(mesh.position, {
                    y: 1.2,
                    duration: 0.15,
                    yoyo: true,
                    repeat: 1,
                    ease: "power1.inOut"
                });
            } else {
                syncBoardFromEngine();
            }

            updateUI();
        }

        function highlightValidMoves(sq) {
            clearRings();
            const moves = chess.moves({ square: sq, verbose: true });

            // Highlight selected
            addRing(sq, 0x6366f1);

            // Highlight valid target squares
            moves.forEach(m => {
                addRing(m.to, 0x10b981);
            });
        }

        function addRing(sq, colorHex) {
            const pos = squareToVector(sq);
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.35, 0.65, 32),
                new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide })
            );
            ring.rotation.x = Math.PI / 2;
            ring.position.set(pos.x, 0.02, pos.z);
            scene.add(ring);
            highlightRings.push(ring);
        }

        function clearRings() {
            highlightRings.forEach(r => scene.remove(r));
            highlightRings = [];
        }

        function deselectSquare() {
            selectedSquare = null;
            clearRings();
        }

        // --- Offline AI Engine ---
        function triggerBotMove() {
            if (chess.game_over()) return;

            const moves = chess.moves({ verbose: true });
            if (moves.length === 0) return;

            let selectedMove;

            if (botLevel === 1) { // Squire: Random Moves
                selectedMove = moves[Math.floor(Math.random() * moves.length)];
            } else if (botLevel === 2) { // Castellan: Prioritizes Captures
                const captures = moves.filter(m => m.captured);
                selectedMove = captures.length > 0 ? captures[Math.floor(Math.random() * captures.length)] : moves[Math.floor(Math.random() * moves.length)];
            } else { // Emperor: Simple Value Heuristic
                const values = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
                moves.sort((a, b) => {
                    const valA = a.captured ? values[a.captured] : 0;
                    const valB = b.captured ? values[b.captured] : 0;
                    return valB - valA;
                });
                selectedMove = moves[0];
            }

            makeMove(selectedMove);
        }

        // --- WebRTC PeerJS Multiplayer ---
        function initPeerJS() {
            const randomCode = 'MALA-' + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(randomCode);

            peer.on('open', (id) => {
                myRoomCode = id;
                document.getElementById('input-my-code').value = id;
            });

            peer.on('connection', (c) => {
                conn = c;
                setupP2PConnection();
                showToast("Opponent Joined! Game Starting...");
                document.getElementById('modal-p2p').classList.add('hidden');
            });
        }

        function setupP2PConnection() {
            gameMode = 'p2p';
            conn.on('data', (data) => {
                if (data.type === 'MOVE') {
                    makeMove(data.move);
                } else if (data.type === 'RESET') {
                    chess.reset();
                    syncBoardFromEngine();
                    showToast("Opponent Reset the Game");
                }
            });
        }

        // --- Helper Utilities & UI Updates ---
        function coordsToSquare(r, c) {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            return `${files[c]}${8 - r}`;
        }

        function squareToVector(sq) {
            const col = sq.charCodeAt(0) - 97; // 'a' -> 0
            const row = 8 - parseInt(sq.charAt(1)); // '8' -> 0
            return new THREE.Vector3(col * SQUARE_SIZE - OFFSET, 0, row * SQUARE_SIZE - OFFSET);
        }

        function updateUI() {
            // Status Text
            const statusElem = document.getElementById('status-indicator');
            if (chess.in_checkmate()) {
                statusElem.className = 'text-xs font-mono text-red-400 font-bold';
                statusElem.innerText = `CHECKMATE! ${chess.turn() === 'w' ? 'Black' : 'White'} Wins`;
            } else if (chess.in_draw()) {
                statusElem.className = 'text-xs font-mono text-amber-400 font-bold';
                statusElem.innerText = `DRAW GAME`;
            } else if (chess.in_check()) {
                statusElem.className = 'text-xs font-mono text-red-400 animate-pulse flex items-center gap-2';
                statusElem.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> CHECK! ${chess.turn() === 'w' ? "White's" : "Black's"} Turn`;
            } else {
                const turnStr = chess.turn() === 'w' ? "White's Turn" : "Black's Turn";
                statusElem.className = chess.turn() === 'w' ? 'text-xs font-mono text-emerald-400 flex items-center gap-2' : 'text-xs font-mono text-indigo-400 flex items-center gap-2';
                statusElem.innerHTML = `<span class="w-2 h-2 rounded-full ${chess.turn() === 'w' ? 'bg-emerald-400' : 'bg-indigo-400'} animate-pulse"></span> ${turnStr}`;
            }

            // Move Log
            const history = chess.history();
            document.getElementById('move-count').innerText = `${history.length} moves`;
            const logContainer = document.getElementById('move-log');

            if (history.length === 0) {
                logContainer.innerHTML = `<div class="text-slate-600 italic text-center py-2">Select a piece to begin</div>`;
            } else {
                logContainer.innerHTML = history.map((m, idx) => `
                    <div class="flex justify-between items-center py-0.5 border-b border-slate-800/40">
                        <span class="text-slate-600">${idx + 1}.</span>
                        <span class="text-emerald-400 font-bold">${m}</span>
                    </div>
                `).join('');
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        function setupUIEventListeners() {
            // P2P Modal Toggles
            document.getElementById('btn-mode-p2p').onclick = () => document.getElementById('modal-p2p').classList.remove('hidden');
            document.getElementById('close-p2p').onclick = () => document.getElementById('modal-p2p').classList.add('hidden');

            document.getElementById('btn-copy-code').onclick = () => {
                const code = document.getElementById('input-my-code').value;
                navigator.clipboard.writeText(code);
                showToast("Room Code Copied!");
            };

            document.getElementById('btn-join-room').onclick = () => {
                const joinCode = document.getElementById('input-join-code').value.trim().toUpperCase();
                if (!joinCode) return;

                conn = peer.connect(joinCode);
                setupP2PConnection();
                playerColor = 'b'; // Joining player takes Black
                flipBoardView();
                showToast("Connecting to Host...");
                document.getElementById('modal-p2p').classList.add('hidden');
            };

            // Settings Modal
            document.getElementById('btn-settings').onclick = () => document.getElementById('modal-settings').classList.remove('hidden');
            document.getElementById('close-settings').onclick = () => document.getElementById('modal-settings').classList.add('hidden');

            // Difficulty Buttons
            document.querySelectorAll('.btn-diff').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.btn-diff').forEach(b => {
                        b.className = "btn-diff px-3 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 text-xs font-bold";
                    });
                    e.target.className = "btn-diff px-3 py-2 rounded-lg border border-emerald-500/50 bg-emerald-500/20 text-emerald-300 text-xs font-bold";
                    botLevel = parseInt(e.target.dataset.level);
                    showToast(`Bot Level set to: ${e.target.innerText}`);
                };
            });

            // Color Selection
            document.getElementById('btn-color-white').onclick = () => {
                playerColor = 'w';
                camera.position.set(0, 16, 16);
                showToast("Playing as White (Emerald)");
            };
            document.getElementById('btn-color-black').onclick = () => {
                playerColor = 'b';
                camera.position.set(0, 16, -16);
                showToast("Playing as Black (Obsidian)");
            };

            // Reset Game
            document.getElementById('btn-restart').onclick = () => {
                chess.reset();
                syncBoardFromEngine();
                showToast("Board Reset");
                document.getElementById('modal-settings').classList.add('hidden');

                if (gameMode === 'p2p' && conn) {
                    conn.send({ type: 'RESET' });
                }
            };

            // Flip Camera View
            document.getElementById('btn-flip').onclick = flipBoardView;
        }

        function flipBoardView() {
            gsap.to(camera.position, {
                z: -camera.position.z,
                x: -camera.position.x,
                duration: 0.8,
                ease: "power2.inOut",
                onUpdate: () => camera.lookAt(0, 0, 0)
            });
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
